name: NullTrace Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nulltrace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure NullTrace
        shell: pwsh
        run: ./scripts/migrate-nulltrace.ps1

      - name: Build
        run: ./gradlew --no-daemon :${{ matrix.minecraft }}:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: NullTrace-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download built jars
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(find release -type f -name '*.jar' ! -name '*-sources.jar' -print | sort)
          if [[ ${#JARS[@]} -eq 0 ]]; then
            echo 'No release jars found.' >&2
            exit 1
          fi

          DATE="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="nightly-${DATE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          for jar in "${JARS[@]}"; do
            base="$(basename "$jar")"
            mv "$jar" "release/NullTrace-${base}"
          done

          mapfile -t JARS < <(find release -type f -name '*.jar' ! -name '*-sources.jar' -print | sort)

          gh release create "$TAG" \
            "${JARS[@]}" \
            --title "NullTrace Nightly ${DATE} (${SHORT_SHA})" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build from main. Commit: ${GITHUB_SHA}. Build date: ${DATE} UTC."

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa nightly "$GITHUB_SHA" -m "NullTrace nightly ${SHORT_SHA}"
          git push origin refs/tags/nightly --force

      - name: Publish stable release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(find release -type f -name '*.jar' ! -name '*-sources.jar' -print | sort)
          if [[ ${#JARS[@]} -eq 0 ]]; then
            echo 'No release jars found.' >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          for jar in "${JARS[@]}"; do
            base="$(basename "$jar")"
            mv "$jar" "release/NullTrace-${base}"
          done

          mapfile -t JARS < <(find release -type f -name '*.jar' ! -name '*-sources.jar' -print | sort)

          gh release create "$GITHUB_REF_NAME" \
            "${JARS[@]}" \
            --title "NullTrace ${VERSION}" \
            --generate-notes

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa stable "$GITHUB_SHA" -m "NullTrace stable ${VERSION}"
          git push origin refs/tags/stable --force
