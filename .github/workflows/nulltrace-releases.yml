name: NullTrace Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nulltrace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure NullTrace
        shell: pwsh
        run: ./scripts/migrate-nulltrace.ps1

      - name: Build
        run: ./gradlew --no-daemon :${{ matrix.minecraft }}:build --stacktrace

      - name: Locate JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "versions/${{ matrix.minecraft }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo 'No release JAR found.' >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: NullTrace-${{ matrix.minecraft }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish nightly GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="nightly-mc${{ matrix.minecraft }}-${DATE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          SOURCE_JAR="${{ steps.jar.outputs.path }}"
          RELEASE_JAR="release/NullTrace-${{ matrix.minecraft }}-${DATE}-${SHORT_SHA}.jar"

          mkdir -p release
          cp "$SOURCE_JAR" "$RELEASE_JAR"

          gh release create "$TAG" \
            "$RELEASE_JAR" \
            --title "NullTrace Nightly - Minecraft ${{ matrix.minecraft }} - ${DATE}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automated nightly build for Minecraft ${{ matrix.minecraft }}.\n\nCommit: ${GITHUB_SHA}\nBuild: ${GITHUB_RUN_NUMBER}\nDate: ${DATE} UTC"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa nightly "$GITHUB_SHA" -m "NullTrace nightly ${SHORT_SHA}"
          git push origin refs/tags/nightly --force

  publish-stable:
    name: Publish stable GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download built JARs
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: NullTrace-*
          merge-multiple: true

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(find release -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print | sort)
          if [[ ${#JARS[@]} -eq 0 ]]; then
            echo 'No release JARs found.' >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release/stable
          RELEASE_JARS=()
          for jar in "${JARS[@]}"; do
            base="$(basename "$jar")"
            dest="release/stable/NullTrace-${base}"
            cp "$jar" "$dest"
            RELEASE_JARS+=("$dest")
          done

          gh release create "$GITHUB_REF_NAME" \
            "${RELEASE_JARS[@]}" \
            --title "NullTrace ${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa stable "$GITHUB_SHA" -m "NullTrace stable ${VERSION}"
          git push origin refs/tags/stable --force
