# NullTrace CI
#
# Design notes (see docs/devops/runbook.md for the operator view):
#
#  * Cheap checks run before expensive ones. `preflight` is pure Python and fails
#    in seconds; nothing spends a Gradle build until it passes.
#  * Full 4-target matrix only on `main` and release tags. Merge requests and
#    feature branches build one target, which is where the compute minutes went.
#  * A release publishes only when the builds, both test matrices, the jar audit
#    and the tag guard have all passed. The previous version let `publish` start
#    as soon as the build artifacts existed, so a tag could ship an untested jar.
#  * Checksums are generated and verified by tools/ci/gen_sums.py, which writes
#    bare file names. `sha256sum release/x.jar > release/x.jar.sha256` embeds the
#    release/ prefix and breaks `sha256sum -c` for anyone who downloads the pair.
#
# Self-hosted runners: if the namespace runs out of shared-runner minutes, register
# a runner on your own machine and give it a tag, then uncomment the `tags:` block
# in `default:` below. Nothing else in this file needs to change.

stages:
  - validate
  - build
  - test
  - audit
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # A branch with an open MR already has an MR pipeline; skip the duplicate.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_CACHE_PATHS: ""
  # Enough history for `git describe` without cloning the whole repository.
  GIT_DEPTH: "20"

default:
  interruptible: true
  timeout: 45m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # tags: [self-hosted]

# --------------------------------------------------------------------- anchors

.matrix_rules: &matrix_rules
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - when: never

.smoke_rules: &smoke_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  - when: never

.tag_rules: &tag_rules
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  - when: never

.gradle_cache: &gradle_cache
  key: "gradle-$MC_VERSION"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# -------------------------------------------------------------------- validate

preflight:
  # Runs in seconds and in every pipeline. Everything that can be checked without
  # compiling lives here: CI syntax and job selection, release metadata, mixin
  # wiring, the Python fixtures, and the self-tests for the checks themselves.
  stage: validate
  image: python:3.12-alpine
  cache: []
  script:
    - apk add --no-cache py3-yaml >/dev/null
    - |
      set -u
      status=0
      run() {
        echo ""
        echo "=== $* ==="
        "$@" || status=1
      }
      run python3 tools/ci/lint_gitlab_ci.py --quiet --scenario all
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        run python3 tools/ci/check_metadata.py --tag "$CI_COMMIT_TAG"
      else
        run python3 tools/ci/check_metadata.py
      fi
      run python3 tools/ci/check_sources.py
      run python3 -m unittest discover -s tests -p 'test_*.py'
      run python3 tools/ci/selftest.py
      if [ "$status" -ne 0 ]; then
        echo "preflight failed: fix the checks above before spending build minutes" >&2
        exit 1
      fi
      echo "preflight passed"

# ----------------------------------------------------------------------- build

.build_template:
  stage: build
  image: eclipse-temurin:25-jdk
  cache:
    <<: *gradle_cache
    policy: pull-push
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew --no-daemon --stacktrace ":$MC_VERSION:build"
    # Keep the dependency report where a JDK and a warm cache already exist
    # instead of paying for a second Gradle start in the audit stage.
    - if [ "$MC_VERSION" = "26.3" ]; then ./gradlew --no-daemon -q ":26.3:dependencies" --configuration runtimeClasspath > dependency-report.txt; fi
    - mkdir -p release
    - find "versions/$MC_VERSION/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
    - test -n "$(find release -type f -name '*.jar' -print -quit)"
  artifacts:
    name: "NullTrace-$MC_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*.jar
      - dependency-report.txt
    expire_in: 30 days

build_matrix:
  extends: .build_template
  parallel:
    matrix:
      - MC_VERSION: "1.21.11"
      - MC_VERSION: "26.1"
      - MC_VERSION: "26.2"
      - MC_VERSION: "26.3"
  rules: *matrix_rules

build_smoke:
  extends: .build_template
  variables:
    MC_VERSION: "26.3"
  rules: *smoke_rules

# ------------------------------------------------------------------------ test

.gradle_test_template:
  stage: test
  image: eclipse-temurin:25-jdk
  needs: []
  cache:
    <<: *gradle_cache
    policy: pull
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew --no-daemon --stacktrace ":${MC_VERSION}:test"
  artifacts:
    when: always
    reports:
      junit: "versions/$MC_VERSION/build/test-results/test/*.xml"
    expire_in: 7 days

policy_tests_matrix:
  extends: .gradle_test_template
  parallel:
    matrix:
      - MC_VERSION: "1.21.11"
      - MC_VERSION: "26.3"
  rules: *matrix_rules

policy_tests_smoke:
  extends: .gradle_test_template
  variables:
    MC_VERSION: "26.3"
  rules: *smoke_rules

proxy_probe_harness:
  # Standalone JDK-only harness for the proxy feature (tests/proxy/README.md). It
  # starts its own fake HTTP CONNECT / SOCKS5 endpoints, so it needs no Minecraft
  # and no Gradle.
  stage: test
  image: eclipse-temurin:25-jdk
  needs: []
  cache: []
  script:
    - |
      cat > /tmp/Fetch.java <<'EOF'
      import java.io.InputStream;
      import java.net.URI;
      import java.nio.file.Files;
      import java.nio.file.Path;
      import java.nio.file.StandardCopyOption;

      class Fetch {
          public static void main(String[] args) throws Exception {
              try (InputStream in = URI.create(args[0]).toURL().openStream()) {
                  Files.copy(in, Path.of(args[1]), StandardCopyOption.REPLACE_EXISTING);
              }
          }
      }
      EOF
    - java /tmp/Fetch.java https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar /tmp/gson.jar
    - test -s /tmp/gson.jar
    - mkdir -p /tmp/proxy-harness
    - >
      javac -encoding UTF-8 -d /tmp/proxy-harness -cp /tmp/gson.jar
      tests/proxy/stub/net/nulltrace/mod/NullTrace.java
      src/client/java/net/nulltrace/mod/lang/NullTraceStrings.java
      src/client/java/net/nulltrace/mod/proxy/ProxyEntry.java
      src/client/java/net/nulltrace/mod/proxy/ProxySettings.java
      src/client/java/net/nulltrace/mod/proxy/ProxyTester.java
      tests/proxy/FakeProxyServers.java
      tests/proxy/ProxyProbeHarness.java
    - java -cp /tmp/gson.jar:/tmp/proxy-harness ProxyProbeHarness

vault_harness:
  # JDK-only test for the account token vault (tests/vault/README.md): base64 round-trip,
  # AES-GCM AAD binding, tamper rejection and v1 migration. No Minecraft, no Gradle.
  stage: test
  image: eclipse-temurin:25-jdk
  needs: []
  cache: []
  script:
    - mkdir -p /tmp/vault-harness
    - >
      javac -encoding UTF-8 -d /tmp/vault-harness
      tests/vault/stub/net/fabricmc/loader/api/FabricLoader.java
      tests/vault/stub/net/nulltrace/mod/NullTrace.java
      src/client/java/net/nulltrace/mod/accounts/AccountTokenVault.java
      tests/vault/bridge/net/nulltrace/mod/accounts/AccountTokenVaultAccess.java
      tests/vault/VaultHarness.java
    - java -cp /tmp/vault-harness VaultHarness

# ----------------------------------------------------------------------- audit

jar_audit:
  # Pure zip reads: no JDK, no Gradle, no network. Replaces the shell block that
  # used to grep a refmap name and nothing else.
  stage: audit
  image: python:3.12-alpine
  cache: []
  needs:
    - job: build_matrix
      artifacts: true
      optional: true
    - job: build_smoke
      artifacts: true
      optional: true
  script:
    - |
      set -u
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION_FLAG="--version ${CI_COMMIT_TAG#v} --strict"
      else
        VERSION_FLAG=""
      fi
      # shellcheck disable=SC2086
      python3 tools/ci/inspect_jar.py $VERSION_FLAG release/*.jar
    - python3 tools/ci/gen_sums.py --release-dir release --verify
    - |
      # Prove a user can verify a download: bare file names, LF endings.
      cd release
      for JAR in *.jar; do sha256sum -c "$JAR.sha256"; done
  artifacts:
    name: "NullTrace-checksums-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - release/*.sha256
      - release/SHA256SUMS
      - release/release-manifest.json
      - dependency-report.txt
    expire_in: 30 days

# --------------------------------------------------------------------- release

publish:
  stage: release
  image: alpine:3.22
  # One release at a time: two tag pipelines must not interleave uploads.
  resource_group: release
  needs:
    - job: preflight
    - job: policy_tests_matrix
    - job: policy_tests_smoke
      optional: true
    - job: proxy_probe_harness
    - job: jar_audit
      artifacts: true
    - job: build_matrix
      artifacts: true
  rules: *tag_rules
  before_script:
    - apk add --no-cache curl unzip >/dev/null
  script:
    - |
      set -eu
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      VERSION="$CI_COMMIT_TAG"
      EXPECTED="${VERSION#v}"

      echo "Assets to publish:"
      ls -l release

      # Every artifact must carry the tag's version; the updater only offers
      # strictly newer versions, so a mismatched jar is invisible to users.
      for JAR in release/*.jar; do
        ACTUAL="$(unzip -p "$JAR" fabric.mod.json | grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n 1 | sed 's/.*:[[:space:]]*"\([^"]*\)"/\1/')"
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "$JAR reports '$ACTUAL', tag is $VERSION" >&2
          exit 1
        fi
      done
      echo "all jars report $EXPECTED"

      post() {
        code="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          --output /tmp/response.json --write-out '%{http_code}' \
          --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" "$@")"
        case "$code" in
          2*) return 0 ;;
          409) echo "  already exists (409)"; return 0 ;;
          *) echo "  HTTP $code: $(cat /tmp/response.json)" >&2; return 1 ;;
        esac
      }

      echo "Creating release $VERSION"
      post --data-urlencode "name=NullTrace $VERSION" \
           --data-urlencode "tag_name=$VERSION" \
           --data-urlencode "description=NullTrace $VERSION for Minecraft 1.21.11, 26.1, 26.2 and 26.3. Checksums and a provenance manifest are attached." \
           "$API/releases"

      for ARTIFACT in release/*.jar release/*.sha256 release/SHA256SUMS release/release-manifest.json; do
        [ -f "$ARTIFACT" ] || continue
        NAME="$(basename "$ARTIFACT")"
        URL="$API/packages/generic/nulltrace/$VERSION/$NAME"
        echo "Uploading $NAME"
        curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          --request PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$ARTIFACT" "$URL"
        post --data-urlencode "name=$NAME" \
             --data-urlencode "url=$URL" \
             --data-urlencode "link_type=package" \
             "$API/releases/$VERSION/assets/links" || echo "  warning: could not link $NAME"
      done

      echo "Published $VERSION"

pages:
  # Optional: publishes docs/ and the changelog to GitLab Pages, which is where
  # fabric.mod.json's homepage points. Manual on purpose - enable Pages in the
  # project settings first, or leave this job alone.
  stage: release
  image: alpine:3.22
  needs: []
  script:
    - mkdir -p public
    - cp -r docs/. public/
    - cp README.md CHANGELOG.md public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
