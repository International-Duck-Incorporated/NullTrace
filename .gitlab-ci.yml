stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"

cache:
  # Keep the cache key simple: GitLab limits cache:key:files to two files.
  key: "gradle-${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

build:
  stage: build
  image: eclipse-temurin:25-jdk
  parallel:
    matrix:
      - MC_VERSION: "1.21.11"
      - MC_VERSION: "26.1"
      - MC_VERSION: "26.2"
      - MC_VERSION: "26.3"
  script:
    - chmod +x ./gradlew
    - ./gradlew --no-daemon ":$MC_VERSION:build" --stacktrace
    - mkdir -p release
    - find "versions/$MC_VERSION/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
    - test -n "$(find release -type f -name '*.jar' -print -quit)"
  artifacts:
    name: "NullTrace-$MC_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*.jar
    expire_in: 30 days

publish:
  stage: release
  image: alpine:3.21
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -eu
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      RELEASE_URL="$API/releases"
      VERSION="$CI_COMMIT_TAG"

      # Create the GitLab release. A pre-existing release is harmless; assets
      # are still uploaded/linked below.
      curl --fail-with-body --silent --show-error --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=NullTrace $VERSION" \
        --data-urlencode "tag_name=$VERSION" \
        --data-urlencode "description=NullTrace release $VERSION for Minecraft 1.21.11, 26.1, 26.2 and 26.3." \
        "$RELEASE_URL" || true

      for JAR in release/*.jar; do
        NAME="$(basename "$JAR")"
        PACKAGE_URL="$API/packages/generic/nulltrace/$VERSION/$NAME"

        curl --fail-with-body --silent --show-error --request PUT \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$JAR" \
          "$PACKAGE_URL"

        curl --fail-with-body --silent --show-error --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data-urlencode "name=$NAME" \
          --data-urlencode "url=$PACKAGE_URL" \
          --data-urlencode "link_type=package" \
          "$RELEASE_URL/$VERSION/assets/links" || true
      done

      echo "Published $VERSION assets:"
      find release -maxdepth 1 -type f -name '*.jar' -printf ' - %f\n'
