stages:
  - build
  - test
  - security
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"

cache:
  # Keep the cache key simple: GitLab limits cache:key:files to two files.
  key: "gradle-${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

build:
  stage: build
  image: eclipse-temurin:25-jdk
  parallel:
    matrix:
      - MC_VERSION: "1.21.11"
      - MC_VERSION: "26.1"
      - MC_VERSION: "26.2"
      - MC_VERSION: "26.3"
  script:
    - chmod +x ./gradlew
    - ./gradlew --no-daemon ":$MC_VERSION:build" --stacktrace
    - mkdir -p release
    - find "versions/$MC_VERSION/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
    - test -n "$(find release -type f -name '*.jar' -print -quit)"
    - for JAR in release/*.jar; do sha256sum "$JAR" > "$JAR.sha256"; done
  artifacts:
    name: "NullTrace-$MC_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - release/*
    expire_in: 30 days

policy_tests:
  # Run the JUnit suite on both ends of the supported range: 1.21.11 is the newest obfuscated
  # target, 26.3 the newest unobfuscated one. Test code that only compiles on one of them used to
  # go unnoticed because only 26.3 was ever built here.
  stage: test
  image: eclipse-temurin:25-jdk
  parallel:
    matrix:
      - MC_VERSION: "1.21.11"
      - MC_VERSION: "26.3"
  script:
    - chmod +x ./gradlew
    - ./gradlew --no-daemon ":$MC_VERSION:test" --stacktrace

proxy_probe_harness:
  # Standalone JDK-only harness for the proxy feature (tests/proxy/README.md). It starts its own
  # fake HTTP CONNECT / SOCKS5 endpoints, so it needs no Minecraft and no Gradle.
  stage: test
  image: eclipse-temurin:25-jdk
  script:
    # eclipse-temurin ships no curl/wget/apt, so fetch gson with the JDK itself
    # (single-file source execution). Same bytes as the curl download.
    - |
      cat > /tmp/Fetch.java <<'EOF'
      import java.io.InputStream;
      import java.net.URI;
      import java.nio.file.Files;
      import java.nio.file.Path;
      import java.nio.file.StandardCopyOption;

      class Fetch {
          public static void main(String[] args) throws Exception {
              try (InputStream in = URI.create(args[0]).toURL().openStream()) {
                  Files.copy(in, Path.of(args[1]), StandardCopyOption.REPLACE_EXISTING);
              }
          }
      }
      EOF
    - java /tmp/Fetch.java https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar /tmp/gson.jar
    - test -s /tmp/gson.jar
    - mkdir -p /tmp/proxy-harness
    - >
      javac -encoding UTF-8 -d /tmp/proxy-harness -cp /tmp/gson.jar
      tests/proxy/stub/net/nulltrace/mod/NullTrace.java
      src/client/java/net/nulltrace/mod/lang/NullTraceStrings.java
      src/client/java/net/nulltrace/mod/proxy/ProxyEntry.java
      src/client/java/net/nulltrace/mod/proxy/ProxySettings.java
      src/client/java/net/nulltrace/mod/proxy/ProxyTester.java
      tests/proxy/FakeProxyServers.java
      tests/proxy/ProxyProbeHarness.java
    - java -cp /tmp/gson.jar:/tmp/proxy-harness ProxyProbeHarness

adversarial_fixture:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -p 'test_*.py' -v

security_audit:
  stage: security
  image: eclipse-temurin:25-jdk
  needs:
    - job: build
      artifacts: true
  script:
    - chmod +x ./gradlew
    - ./gradlew --no-daemon :26.3:dependencies --configuration runtimeClasspath > dependency-report.txt
    - test -s dependency-report.txt
    - test -n "$(find release -type f -name '*.jar' -print -quit)"
    - |
      set -eu
      for JAR in release/*.jar; do
        echo "Inspecting $JAR"
        jar tf "$JAR" > /tmp/listing.txt
        grep -q 'fabric.mod.json' /tmp/listing.txt
        grep -q 'LICENSE' /tmp/listing.txt
        if grep -E '(^|/)accessToken$|(^|/)refreshToken$' /tmp/listing.txt; then
          echo "Unexpected plaintext token resource in $JAR" >&2
          exit 1
        fi
        sha256sum --check "$JAR.sha256"

        # A mixin config that names a refmap must actually ship it. On unobfuscated
        # versions (26.x) Loom generates no refmap, so a leftover "refmap" key is
        # invisible here but shows up as a startup warning for every user.
        rm -rf /tmp/jarroot && mkdir -p /tmp/jarroot
        ( cd /tmp/jarroot && jar xf "$OLDPWD/$JAR" )
        for CFG in $(cd /tmp/jarroot && find . -name '*mixins.json'); do
          REFMAP="$(sed -n 's/.*"refmap"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "/tmp/jarroot/$CFG")"
          test -n "$REFMAP" || continue
          if [ ! -f "/tmp/jarroot/$REFMAP" ]; then
            echo "$CFG in $JAR declares refmap '$REFMAP' but the jar does not contain it" >&2
            exit 1
          fi
        done
      done
  artifacts:
    when: always
    paths:
      - dependency-report.txt
      - release/*.sha256
    expire_in: 30 days

publish:
  stage: release
  image: alpine:3.21
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -eu
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      RELEASE_URL="$API/releases"
      VERSION="$CI_COMMIT_TAG"

      # Create the GitLab release. A pre-existing release is harmless; assets
      # are still uploaded/linked below.
      curl --fail-with-body --silent --show-error --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=NullTrace $VERSION" \
        --data-urlencode "tag_name=$VERSION" \
        --data-urlencode "description=NullTrace release $VERSION for Minecraft 1.21.11, 26.1, 26.2 and 26.3." \
        "$RELEASE_URL" || true

      for ARTIFACT in release/*.jar release/*.sha256; do
        NAME="$(basename "$ARTIFACT")"
        PACKAGE_URL="$API/packages/generic/nulltrace/$VERSION/$NAME"

        curl --fail-with-body --silent --show-error --request PUT \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$ARTIFACT" \
          "$PACKAGE_URL"

        curl --fail-with-body --silent --show-error --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data-urlencode "name=$NAME" \
          --data-urlencode "url=$PACKAGE_URL" \
          --data-urlencode "link_type=package" \
          "$RELEASE_URL/$VERSION/assets/links" || true
      done

      echo "Published $VERSION assets:"
      find release -maxdepth 1 -type f \( -name '*.jar' -o -name '*.sha256' \) -printf ' - %f\n'
