org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Network resiliency. Third-party Maven hosts used by this build (notably
# maven.kikugie.dev) intermittently stall; without a bounded timeout Gradle can
# hang for minutes and then fail the whole job.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=3
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Shared Mod Properties
mod_version=2.0.1
maven_group=net.nulltrace

# Fabric Loader (shared across versions)
loader_version=0.19.5

# Loom version (must be the same for ALL version targets to avoid classloader conflicts)
loom_version=1.17.11

# Acknowledge Stonecutter Groovy-DSL advisory (build.gradle is Groovy by design); silence the nag.
dev.kikugie.stonecutter.hard_mode=true
